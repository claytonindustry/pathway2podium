<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Sailing — Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2233; --navy-soft:#22455f; --paper:#f2f5f6; --card:#fff;
  --ink:#122430; --quiet:#5b7183; --rule:#c9d6dd; --hair:#e3eaee;
  --starboard:#00843d; --port:#c8102e; --flag:#1f5c8b; --tint:#e4edf1; --amber:#b4690e;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;letter-spacing:-.01em;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}

.topbar{background:var(--navy);color:#e9f1f5;padding:0 20px;display:flex;align-items:center;gap:16px;height:60px;position:sticky;top:0;z-index:40;}
.brand{font-weight:600;font-size:17px;}
.brand small{display:block;font-weight:400;font-size:11px;color:#7fa8c2;letter-spacing:.02em;}
.topbar .spacer{flex:1;}
.who{font-size:13px;color:#bcd3e0;text-align:right;line-height:1.3;}
.who b{display:block;color:#e9f1f5;font-weight:500;}
.iconbtn{background:none;border:1px solid #2d5673;color:#cfe2ec;border-radius:6px;padding:7px 12px;font-size:13px;}
.iconbtn:hover{border-color:#4d87ad;}

.wrap{max-width:1020px;margin:0 auto;padding:26px 20px 100px;}
.narrow{max-width:520px;margin:0 auto;padding:40px 20px 100px;}

.card{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:22px;margin:0 0 20px;}
.card h2{font-size:20px;margin:0 0 4px;color:var(--navy);}
.card .sub{color:var(--quiet);font-size:14px;margin:0 0 18px;}

label{display:block;font-size:13px;font-weight:500;color:var(--navy-soft);margin:14px 0 5px;}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:#fff;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--flag);outline-offset:-1px;border-color:var(--flag);}
textarea{min-height:90px;resize:vertical;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.row{grid-template-columns:1fr;}}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-weight:500;}
.btn:hover{background:var(--navy-soft);}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--rule);}
.btn.ghost:hover{background:var(--tint);}
.btn.go{background:var(--starboard);}
.btn.stop{background:var(--port);}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:5px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}

.boardsec{margin:0 0 34px;}
.boardsec h2{font-size:15px;color:var(--navy);margin:0 0 2px;}
.boardsec .count{color:var(--quiet);font-size:13px;margin:0 0 12px;}
.grp{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:13px 16px;margin:0 0 9px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.grp .main{flex:1;min-width:180px;cursor:pointer;}
.grp .nm{font-weight:600;color:var(--navy);}
.grp .meta{font-size:13px;color:var(--quiet);}
.grp .dates{font-size:13px;white-space:nowrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.dot.on{background:var(--starboard);} .dot.wait{background:var(--amber);} .dot.up{background:var(--flag);}
.dot.off{background:var(--rule);} .dot.no{background:var(--port);}
.late{color:var(--port);font-weight:500;}
.empty{color:var(--quiet);font-size:14px;padding:14px 16px;background:var(--card);border:1px dashed var(--rule);border-radius:8px;}

.tabs{display:flex;gap:4px;margin:0 0 24px;border-bottom:1px solid var(--rule);flex-wrap:wrap;}
.tabs button{background:none;border:0;padding:10px 14px;color:var(--quiet);font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.sel{color:var(--navy);border-bottom-color:var(--navy);}

.scrim{position:fixed;inset:0;background:rgba(13,34,51,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:60;}
.modal{background:var(--card);border-radius:10px;max-width:640px;width:100%;padding:24px;margin:auto;}
.modal h2{font-size:20px;color:var(--navy);}
.modal .x{float:right;background:none;border:0;font-size:22px;color:var(--quiet);line-height:1;}

.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--navy-soft);}
.pill.ok{background:#e2f2e9;color:var(--starboard);}
.pill.warn{background:#fdf0dd;color:var(--amber);}
.pill.bad{background:#fbe4e7;color:var(--port);}
table.list{width:100%;border-collapse:collapse;font-size:14px;}
table.list th{text-align:left;font-weight:600;color:var(--navy);padding:8px 10px;background:var(--tint);}
table.list td{padding:9px 10px;border-top:1px solid var(--hair);vertical-align:top;}
.msg{padding:11px 14px;border-radius:6px;margin:0 0 16px;font-size:14px;}
.msg.err{background:#fbe4e7;color:#8c0b20;}
.msg.ok{background:#e2f2e9;color:#0a5c30;}
.hint{font-size:13px;color:var(--quiet);margin:6px 0 0;}
.build{position:fixed;bottom:8px;right:12px;font-size:11px;color:var(--quiet);z-index:10;}
.center{text-align:center;}
hr{border:0;border-top:1px solid var(--hair);margin:22px 0;}
</style>
</head>
<body>

<div id="app"></div>
<div class="build">P3</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   P2P Sailing — Check-In.  Build P3.
   Flat accounts. No groups. Every sailor and coach requests
   their own dates; admins approve them.
   ============================================================ */

/* --- CHECK THIS against the URL at the top of your Realtime
       Database data viewer. Non us-central1 databases look like
       https://pathway2podium-default-rtdb.<region>.firebasedatabase.app --- */
const DATABASE_URL = "https://pathway2podium-default-rtdb.firebaseio.com";

const ARCHITECT = "colinjamesclayton@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyCoC9OXeahZ-GshKpRBVpEXJymtvR4ayVw",
  authDomain: "pathway2podium.firebaseapp.com",
  databaseURL: DATABASE_URL,
  projectId: "pathway2podium",
  storageBucket: "pathway2podium.firebasestorage.app",
  messagingSenderId: "828644304538",
  appId: "1:828644304538:web:12fd47eaf2a18f1cff6123"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const DEFAULT_WAIVER = {
  version: 1,
  body: "I confirm that I am participating in activities at the P2P Sailing Center voluntarily and at my own risk. I confirm that I am medically fit to sail, that I can swim, and that I will wear a personal flotation device when afloat. I accept responsibility for my own equipment and for any damage I cause to the property of others. I agree to follow the instructions of P2P Sailing Center staff at all times.\n\nThis waiver applies to this and all future visits until P2P Sailing issues a revised version."
};

/* ---------- state ---------- */
let S = {
  user:null, me:null, isAdmin:false, isArchitect:false, adminsLoaded:false,
  users:{}, visits:{}, myVisits:{}, admins:{}, waiver:DEFAULT_WAIVER,
  tab:"board", modal:null, msg:null, onboardStep:null, draft:{}, search:""
};
const $app = document.getElementById("app");

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ekey = e => String(e||"").toLowerCase().replace(/\./g,",");
const now = () => Date.now();

function fmt(ts){
  if(!ts) return "—";
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function fmtDay(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
function toLocalInput(ts){
  if(!ts) return "";
  const d=new Date(ts),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const fromLocalInput = v => v ? new Date(v).getTime() : null;
function flash(t,k){ S.msg={text:t,kind:k||"ok"}; render(); setTimeout(()=>{S.msg=null;render();},4000); }
function waiverOK(u){ return !!(u&&u.waiver&&u.waiver.version>=(S.waiver.version||1)); }

/* all visits, flattened, with the person attached */
function allVisits(){
  const out=[];
  Object.entries(S.visits).forEach(([uid,set])=>{
    Object.entries(set||{}).forEach(([vid,v])=>{
      out.push(Object.assign({vid,uid,person:S.users[uid]||{}},v));
    });
  });
  return out;
}
function myVisitList(){
  return Object.entries(S.myVisits).map(([vid,v])=>Object.assign({vid},v))
    .sort((a,b)=>(b.requestedArrival||0)-(a.requestedArrival||0));
}
function personLine(p){
  const bits=[p.accountType==="coach"?"Coach":"Sailor"];
  if(p.federation) bits.push(p.federation);
  const boat=[p.boatClass,p.sailNumber].filter(Boolean).join(" ");
  if(boat) bits.push(boat);
  return bits.join(" · ");
}

/* ---------- data ---------- */
function watchCommon(){
  db.ref("admins").on("value",
    s=>{S.admins=s.val()||{};S.adminsLoaded=true;recomputeAdmin();watchScoped();render();},
    ()=>{S.adminsLoaded=true;recomputeAdmin();watchScoped();render();});
  db.ref("waiver").on("value",s=>{S.waiver=s.val()||DEFAULT_WAIVER;render();},()=>{});
}
let scoped=false;
function watchScoped(){
  if(scoped||!S.user) return;
  scoped=true;
  if(S.isAdmin){
    db.ref("users").on("value",s=>{S.users=s.val()||{};render();},()=>{});
    db.ref("visits").on("value",s=>{S.visits=s.val()||{};render();},()=>{});
  }else{
    db.ref("visits/"+S.user.uid).on("value",s=>{S.myVisits=s.val()||{};render();},()=>{});
  }
}
function recomputeAdmin(){
  const e=(S.user&&S.user.email||"").toLowerCase();
  S.isArchitect = e===ARCHITECT;
  S.isAdmin = S.isArchitect || !!S.admins[ekey(e)];
}

auth.onAuthStateChanged(u=>{
  S.user=u; scoped=false;
  if(!u){ S.me=null; S.adminsLoaded=false; render(); return; }
  db.ref("users/"+u.uid).on("value",s=>{
    S.me=s.val(); recomputeAdmin();
    if(!S.me) S.onboardStep = S.onboardStep||"type";
    render();
  },()=>{});
  watchCommon();
});

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  if(!S.user){ $app.innerHTML=viewAuth(); return bind(); }
  if(!S.me){
    if(!S.adminsLoaded){ $app.innerHTML=chrome(viewLoading()); return bind(); }
    $app.innerHTML=chrome(S.isAdmin?viewStaffSetup():viewOnboard());
    return bind();
  }
  $app.innerHTML=chrome(S.isAdmin?viewAdmin():viewPerson());
  bind();
}

function chrome(inner){
  const role=S.isArchitect?"Architect":S.isAdmin?"Admin":(S.me&&S.me.accountType==="coach"?"Coach":"Sailor");
  return `
  <div class="topbar">
    <div class="brand">P2P Sailing<small>PATHWAY2PODIUM · CHECK-IN</small></div>
    <div class="spacer"></div>
    <div class="who"><b>${esc(S.user.email||"")}</b>${esc(role)}</div>
    <button class="iconbtn" data-act="signout">Sign out</button>
  </div>
  ${inner}
  ${S.modal?viewModal():""}`;
}
const msgHTML = () => S.msg?`<div class="msg ${S.msg.kind==="err"?"err":"ok"}">${esc(S.msg.text)}</div>`:"";
const viewLoading = () => `<div class="narrow"><div class="card center"><p class="sub" style="margin:0">Loading…</p></div></div>`;

/* ---------- auth ---------- */
function viewAuth(){
  return `
  <div class="topbar"><div class="brand">P2P Sailing<small>PATHWAY2PODIUM · CHECK-IN</small></div></div>
  <div class="narrow">${msgHTML()}
    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">Create an account, then request the dates you would like to use the P2P Sailing Center.</p>
      <button class="btn" data-act="google" style="width:100%">Continue with Google</button>
      <hr>
      <label for="ae">Email</label><input type="email" id="ae" autocomplete="email">
      <label for="ap">Password</label><input type="password" id="ap" autocomplete="current-password">
      <div class="actions">
        <button class="btn" data-act="signin">Sign in</button>
        <button class="btn ghost" data-act="signup">Create account</button>
      </div>
      <p class="hint">Six characters or more for a new password.</p>
    </div>
  </div>`;
}

/* ---------- staff ---------- */
function viewStaffSetup(){
  return `<div class="narrow">${msgHTML()}
    <div class="card">
      <h2>Staff account</h2>
      <p class="sub">You have admin access${S.isArchitect?" as the Architect":""}. Staff never appear on the board or in the export.</p>
      <label>Your name</label><input type="text" id="st_name" placeholder="Shown on the audit trail">
      <div class="actions"><button class="btn" data-act="staffsave">Continue to the board</button></div>
    </div></div>`;
}

/* ---------- onboarding ---------- */
function viewOnboard(){
  const step=S.onboardStep||"type";

  if(step==="type") return `<div class="narrow">${msgHTML()}
    <div class="card">
      <h2>Are you a sailor or a coach?</h2>
      <p class="sub">Both request their own dates. The difference is only which details we collect.</p>
      <div class="actions">
        <button class="btn" data-act="type" data-v="sailor">I am a sailor</button>
        <button class="btn" data-act="type" data-v="coach">I am a coach</button>
      </div>
    </div></div>`;

  if(step==="profile"){
    const c=S.draft.accountType==="coach";
    return `<div class="narrow">${msgHTML()}
    <div class="card">
      <h2>Your details</h2>
      <p class="sub">P2P staff maintain these once saved — ask an admin if anything needs changing later.</p>
      <label>Full name</label><input type="text" id="p_name" value="${esc(S.draft.name||"")}">
      ${c?"":`<label>Date of birth</label><input type="date" id="p_dob" value="${esc(S.draft.dob||"")}">`}
      <div class="row">
        <div><label>Phone</label><input type="tel" id="p_phone" value="${esc(S.draft.phone||"")}"></div>
        <div><label>Email</label><input type="email" id="p_email" value="${esc(S.draft.email||S.user.email||"")}"></div>
      </div>
      <label>Postal address</label><textarea id="p_addr">${esc(S.draft.address||"")}</textarea>
      <label>Federation</label><input type="text" id="p_fed" placeholder="US Sailing, RYA, FFVoile…" value="${esc(S.draft.federation||"")}">
      ${c?`<div class="row">
        <div><label>Certification</label><input type="text" id="p_cert" value="${esc(S.draft.certification||"")}"></div>
        <div><label>Club or program</label><input type="text" id="p_club" value="${esc(S.draft.club||"")}"></div>
      </div>`:`<div class="row">
        <div><label>Boat class</label><input type="text" id="p_class" value="${esc(S.draft.boatClass||"")}"></div>
        <div><label>Sail number</label><input type="text" id="p_sail" value="${esc(S.draft.sailNumber||"")}"></div>
      </div>
      <label>Club or program</label><input type="text" id="p_club" value="${esc(S.draft.club||"")}">`}
      <hr>
      <h3 style="font-size:15px;color:var(--navy-soft)">Emergency contact</h3>
      <div class="row">
        <div><label>Name</label><input type="text" id="p_ecn" value="${esc(S.draft.ecName||"")}"></div>
        <div><label>Relationship</label><input type="text" id="p_ecr" value="${esc(S.draft.ecRel||"")}"></div>
      </div>
      <label>Phone</label><input type="tel" id="p_ecp" value="${esc(S.draft.ecPhone||"")}">
      <div class="actions"><button class="btn" data-act="profile-next">Continue to waiver</button></div>
    </div></div>`;
  }

  if(step==="waiver") return `<div class="narrow">${msgHTML()}
    <div class="card">
      <h2>Waiver</h2>
      <p class="sub">Signed once. It carries forward to every future visit.</p>
      <div style="background:var(--tint);padding:16px;border-radius:6px;white-space:pre-wrap;font-size:14px;line-height:1.6">${esc(S.waiver.body)}</div>
      <label>Type your full name to sign</label><input type="text" id="w_sig" placeholder="${esc(S.draft.name||"")}">
      <div class="actions"><button class="btn go" data-act="sign">Sign and finish</button></div>
    </div></div>`;
  return "";
}

/* ---------- sailor / coach ---------- */
function viewPerson(){
  const vs=myVisitList();
  const u=S.me;
  return `<div class="wrap">${msgHTML()}
    <div class="card">
      <h2>${esc(u.name)}</h2>
      <p class="sub">${esc(personLine(u))}</p>
      <table class="list"><tbody>
        <tr><td style="width:180px;color:var(--quiet)">Phone</td><td>${esc(u.phone||"—")}</td></tr>
        <tr><td style="color:var(--quiet)">Email</td><td>${esc(u.email||"—")}</td></tr>
        <tr><td style="color:var(--quiet)">Federation</td><td>${esc(u.federation||"—")}</td></tr>
        ${u.accountType==="coach"
          ?`<tr><td style="color:var(--quiet)">Certification</td><td>${esc(u.certification||"—")}</td></tr>`
          :`<tr><td style="color:var(--quiet)">Boat</td><td>${esc([u.boatClass,u.sailNumber].filter(Boolean).join(" ")||"—")}</td></tr>`}
        <tr><td style="color:var(--quiet)">Emergency contact</td><td>${esc(u.ecName||"—")}${u.ecPhone?" · "+esc(u.ecPhone):""}</td></tr>
        <tr><td style="color:var(--quiet)">Waiver</td><td>${waiverOK(u)
          ?`<span class="pill ok">Signed</span> version ${u.waiver.version}, ${fmtDay(u.waiver.signedAt)}`
          :`<span class="pill bad">Re-sign needed</span> <button class="btn sm ghost" data-act="resign">Sign now</button>`}</td></tr>
      </tbody></table>
      <p class="hint" style="margin-top:14px">Details are maintained by P2P staff. Ask an admin to change anything here.</p>
    </div>

    <div class="card">
      <h2>My requests</h2>
      <p class="sub">Request as many separate visits as you need.</p>
      <div class="actions" style="margin:0 0 18px">
        <button class="btn" data-act="newvisit" ${waiverOK(u)?"":"disabled"}>Request dates</button>
      </div>
      ${waiverOK(u)?"":`<div class="msg err">Sign the current waiver before requesting dates.</div>`}
      ${vs.length?vs.map(v=>myVisitRow(v)).join(""):`<div class="empty">No requests yet.</div>`}
    </div></div>`;
}

const STATUS={
  requested:["wait","Awaiting approval"], approved:["up","Approved"],
  onsite:["on","On site"], departed:["off","Departed"],
  declined:["no","Declined"], cancelled:["no","Cancelled"]
};

function myVisitRow(v){
  const st=STATUS[v.status]||["off",v.status];
  const a=v.approvedArrival||v.requestedArrival, d=v.approvedDeparture||v.requestedDeparture;
  const amended=v.approvedArrival&&(v.approvedArrival!==v.requestedArrival||v.approvedDeparture!==v.requestedDeparture);
  return `<div class="grp">
    <div class="main">
      <div class="nm"><span class="dot ${st[0]}"></span>${st[1]}</div>
      <div class="meta">${fmt(a)} → ${fmt(d)}${amended?" · dates amended by P2P":""}</div>
    </div>
    ${(v.status==="requested"||v.status==="approved")
      ?`<button class="btn sm ghost" data-act="cancelvisit" data-id="${v.vid}">Cancel</button>`:""}
  </div>`;
}

/* ---------- admin ---------- */
function viewAdmin(){
  const tabs=[["board","Board"],["archive","Archives"],["settings","Settings"]];
  return `<div class="wrap">${msgHTML()}
    <div class="tabs">${tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" class="${S.tab===t[0]?"sel":""}">${t[1]}</button>`).join("")}</div>
    ${S.tab==="board"?adminBoard():S.tab==="archive"?adminArchive():adminSettings()}
  </div>`;
}

function adminBoard(){
  const all=allVisits();
  const pend=all.filter(v=>v.status==="requested").sort((a,b)=>(a.requestedArrival||0)-(b.requestedArrival||0));
  const on=all.filter(v=>v.status==="onsite").sort((a,b)=>(a.approvedDeparture||0)-(b.approvedDeparture||0));
  const up=all.filter(v=>v.status==="approved").sort((a,b)=>(a.approvedArrival||0)-(b.approvedArrival||0));
  return `
  ${section("Awaiting approval",pend,"Nothing waiting on a decision.","pend")}
  ${section("On site now",on,"Nobody is checked in.","on")}
  ${section("Upcoming",up,"No approved arrivals.","up")}`;
}

function section(title,list,emptyText,mode){
  return `<div class="boardsec">
    <h2>${title}</h2>
    <p class="count">${list.length} ${list.length===1?"person":"people"}</p>
    ${list.length?list.map(v=>boardRow(v,mode)).join(""):`<div class="empty">${emptyText}</div>`}
  </div>`;
}

function boardRow(v,mode){
  const p=v.person;
  const a=v.approvedArrival||v.requestedArrival, d=v.approvedDeparture||v.requestedDeparture;
  const overdue=mode==="on"&&d&&d<now();
  let right="";
  if(mode==="pend") right=`
    <button class="btn sm go" data-act="approve" data-u="${v.uid}" data-id="${v.vid}">Approve</button>
    <button class="btn sm ghost" data-act="amend" data-u="${v.uid}" data-id="${v.vid}">Amend</button>
    <button class="btn sm stop" data-act="decline" data-u="${v.uid}" data-id="${v.vid}">Decline</button>`;
  if(mode==="up") right=`
    <button class="btn sm go" data-act="checkin" data-u="${v.uid}" data-id="${v.vid}">Check in</button>
    <button class="btn sm ghost" data-act="amend" data-u="${v.uid}" data-id="${v.vid}">Amend</button>`;
  if(mode==="on") right=`<button class="btn sm" data-act="checkout" data-u="${v.uid}" data-id="${v.vid}">Check out</button>`;
  return `<div class="grp">
    <div class="main" data-act="person" data-u="${v.uid}" data-id="${v.vid}">
      <div class="nm">${esc(p.name||"Unknown")}${waiverOK(p)?"":' <span class="pill bad">no waiver</span>'}</div>
      <div class="meta">${esc(personLine(p))}</div>
    </div>
    <div class="dates ${overdue?"late":""}">${fmtDay(a)} → ${fmtDay(d)}${overdue?" · overdue":""}</div>
    ${right}
  </div>`;
}

function adminArchive(){
  const q=S.search.toLowerCase();
  const done=allVisits()
    .filter(v=>["departed","declined","cancelled"].includes(v.status))
    .filter(v=>{
      if(!q) return true;
      const p=v.person;
      return [p.name,p.federation,p.email,p.sailNumber,p.boatClass].join(" ").toLowerCase().includes(q);
    })
    .sort((a,b)=>(b.actualDeparture||b.approvedArrival||b.requestedArrival||0)-(a.actualDeparture||a.approvedArrival||a.requestedArrival||0));
  return `
  <div class="card">
    <h2>Export</h2><p class="sub">One row per person per visit. CSV.</p>
    <div class="row">
      <div><label>From</label><input type="date" id="x_from"></div>
      <div><label>To</label><input type="date" id="x_to"></div>
    </div>
    <div class="actions"><button class="btn" data-act="export">Download CSV</button></div>
  </div>
  <div class="card">
    <h2>Past visits</h2>
    <p class="sub">Departed, declined and cancelled.</p>
    <input type="search" id="q" placeholder="Search name, federation, sail number…" value="${esc(S.search)}">
    <div style="margin-top:16px">
    ${done.length?done.map(v=>{
      const st=STATUS[v.status]||["off",v.status];
      return `<div class="grp"><div class="main" data-act="person" data-u="${v.uid}" data-id="${v.vid}">
        <div class="nm">${esc(v.person.name||"Unknown")}</div>
        <div class="meta"><span class="dot ${st[0]}"></span>${st[1]} · ${esc(v.person.federation||"—")}</div></div>
        <div class="dates">${v.actualArrival?fmtDay(v.actualArrival)+" → "+fmtDay(v.actualDeparture):fmtDay(v.requestedArrival)}</div>
      </div>`;
    }).join(""):`<div class="empty">Nothing archived yet.</div>`}
    </div>
  </div>`;
}

    ${S.isArchitect?`<label>Add an admin</label><input type="email" id="ad_email" placeholder="name@example.org">

    <div class="actions">

      <button class="btn" data-act="bumpwaiver">Publish as version ${(S.waiver.version||1)+1}</button>

}

  const body = m.kind==="person" ? modalPerson(m.u,m.id)
             : m.kind==="amend"  ? modalAmend(m.u,m.id)
             : m.kind==="newvisit" ? modalNewVisit() : "";

}

  return `<button class="x" data-act="close">&times;</button>
  <h2>Request dates</h2>
  <p class="sub">A P2P admin reviews every request. They may amend the dates when approving.</p>

    <div><label>Arrival</label><input type="datetime-local" id="nv_a"></div>
    <div><label>Departure</label><input type="datetime-local" id="nv_d"></div>
  </div>

    <button class="btn" data-act="submitvisit">Submit request</button>
    <button class="btn ghost" data-act="close">Cancel</button>
  </div>`;

/* ============================================================
   ACTIONS
   ============================================================ */
function bind(){
  $app.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick=ev=>{
      if(el.dataset.act==="scrim"&&ev.target!==el) return;
      ev.stopPropagation();
      handle(el.dataset.act,el);
    };
  });
  const q=document.getElementById("q");
  if(q) q.oninput=e=>{S.search=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(p,p);}};
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
const vref=(u,v)=>db.ref("visits/"+u+"/"+v);

async function handle(act,el){
  const U=el.dataset.u, V=el.dataset.id;
  try{
    if(act==="google"){ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; }
    if(act==="signin"){ await auth.signInWithEmailAndPassword(val("ae"),val("ap")); return; }
    if(act==="signup"){ await auth.createUserWithEmailAndPassword(val("ae"),val("ap")); return; }
    if(act==="signout"){ S.onboardStep=null;S.draft={}; await auth.signOut(); location.reload(); return; }

    if(act==="staffsave"){
      const name=val("st_name"); if(!name) return flash("Enter your name.","err");
      await db.ref("users/"+S.user.uid).set({accountType:"staff",name,email:S.user.email,createdAt:now()});
      return;
    }

    if(act==="type"){ S.draft.accountType=el.dataset.v; S.onboardStep="profile"; return render(); }
    if(act==="profile-next"){
      const d=S.draft;
      d.name=val("p_name"); d.phone=val("p_phone"); d.email=val("p_email")||S.user.email;
      d.address=val("p_addr"); d.federation=val("p_fed"); d.club=val("p_club");
      d.ecName=val("p_ecn"); d.ecRel=val("p_ecr"); d.ecPhone=val("p_ecp");
      if(d.accountType==="coach") d.certification=val("p_cert");
      else { d.dob=val("p_dob"); d.boatClass=val("p_class"); d.sailNumber=val("p_sail"); }
      if(!d.name||!d.phone||!d.email||!d.address||!d.federation||!d.ecName||!d.ecPhone)
        return flash("Fill in every field except club, which is optional.","err");
      S.onboardStep="waiver"; return render();
    }
    if(act==="sign"){
      const sig=val("w_sig"), d=S.draft;
      if(sig.toLowerCase()!==String(d.name||"").toLowerCase())
        return flash("The signature must match the name on your profile.","err");
      const rec={
        accountType:d.accountType, email:d.email, name:d.name, phone:d.phone, address:d.address,
        federation:d.federation, club:d.club||"", ecName:d.ecName, ecRel:d.ecRel, ecPhone:d.ecPhone,
        waiver:{version:S.waiver.version||1,signedAt:now(),signature:sig}, createdAt:now()
      };
      if(d.accountType==="coach") rec.certification=d.certification||"";
      else { rec.dob=d.dob||""; rec.boatClass=d.boatClass||""; rec.sailNumber=d.sailNumber||""; }
      await db.ref("users/"+S.user.uid).set(rec);
      S.onboardStep=null; S.draft={};
      return flash("Account created. Request your dates when you are ready.");
    }
    if(act==="resign"){
      await db.ref("users/"+S.user.uid+"/waiver")
        .set({version:S.waiver.version,signedAt:now(),signature:S.me.name});
      return flash("Waiver signed.");
    }

    /* requests */
    if(act==="newvisit"){ S.modal={kind:"newvisit"}; return render(); }
    if(act==="submitvisit"){
      const a=fromLocalInput(val("nv_a")), d=fromLocalInput(val("nv_d"));
      if(!a||!d) return flash("Set both dates.","err");
      if(d<=a) return flash("Departure must be after arrival.","err");
      const ref=db.ref("visits/"+S.user.uid).push();
      await ref.set({
        uid:S.user.uid, requestedArrival:a, requestedDeparture:d, status:"requested",
        createdAt:now(), audit:[{at:now(),by:S.user.email,what:"requested"}]
      });
      S.modal=null; return flash("Request submitted.");
    }
    if(act==="cancelvisit"){
      if(!confirm("Cancel this request?")) return;
      const v=S.myVisits[V]||{};
      await db.ref("visits/"+S.user.uid+"/"+V).update({
        status:"cancelled", audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"cancelled"}])});
      return flash("Request cancelled.");
    }

    /* admin */
    if(act==="tab"){ S.tab=el.dataset.v; return render(); }
    if(act==="person"){ S.modal={kind:"person",u:U,id:V}; return render(); }
    if(act==="amend"){ S.modal={kind:"amend",u:U,id:V}; return render(); }
    if(act==="close"||act==="scrim"){ S.modal=null; return render(); }

    if(act==="approve"){
      const v=(S.visits[U]||{})[V]||{};
      await vref(U,V).update({
        approvedArrival:v.approvedArrival||v.requestedArrival,
        approvedDeparture:v.approvedDeparture||v.requestedDeparture,
        status:"approved", audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"approved"}])});
      S.modal=null; return flash("Approved.");
    }
    if(act==="decline"){
      if(!confirm("Decline this request?")) return;
      const v=(S.visits[U]||{})[V]||{};
      await vref(U,V).update({status:"declined",
        audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"declined"}])});
      S.modal=null; return flash("Declined.");
    }
    if(act==="checkin"){
      const v=(S.visits[U]||{})[V]||{};
      await vref(U,V).update({status:"onsite",actualArrival:now(),
        audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"checked in"}])});
      S.modal=null; return flash("Checked in.");
    }
    if(act==="checkout"){
      const v=(S.visits[U]||{})[V]||{};
      await vref(U,V).update({status:"departed",actualDeparture:now(),
        audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"checked out"}])});
      S.modal=null; return flash("Checked out.");
    }
    if(act==="saveamend"){
      const u=val("am_u"), id=val("am_id"), v=(S.visits[u]||{})[id]||{};
      const a=fromLocalInput(val("am_a")), d=fromLocalInput(val("am_d"));
      if(!a||!d||d<=a) return flash("Check the dates.","err");
      const patch={approvedArrival:a,approvedDeparture:d,
        audit:(v.audit||[]).concat([{at:now(),by:S.user.email,what:"dates amended"}])};
      if(v.status==="requested") patch.status="approved";
      await vref(u,id).update(patch);
      S.modal=null; return flash("Dates saved.");
    }
    if(act==="saveperson"){
      const id=val("ed_id"), u=S.users[id]||{};
      const p={name:val("ed_name"),phone:val("ed_phone"),federation:val("ed_fed"),
        address:val("ed_addr"),club:val("ed_club"),ecName:val("ed_ecn"),ecPhone:val("ed_ecp")};
      if(u.accountType==="coach") p.certification=val("ed_cert");
      else { p.boatClass=val("ed_class"); p.sailNumber=val("ed_sail"); p.dob=val("ed_dob"); }
      await db.ref("users/"+id).update(p);
      S.modal=null; return flash("Saved.");
    }
    if(act==="addadmin"){
      const e=val("ad_email").toLowerCase(); if(!e) return;
      await db.ref("admins/"+ekey(e)).set(true); return flash("Admin granted to "+e);
    }
    if(act==="rmadmin"){ await db.ref("admins/"+V).remove(); return flash("Admin removed."); }
    if(act==="savewaiver"){
      await db.ref("waiver").set({version:S.waiver.version||1,body:val("wv_body")});
      return flash("Waiver text saved.");
    }
    if(act==="bumpwaiver"){
      if(!confirm("Everyone who signed the old version will be asked to sign again. Continue?")) return;
      await db.ref("waiver").set({version:(S.waiver.version||1)+1,body:val("wv_body")});
      return flash("New waiver version published.");
    }
    if(act==="export") return exportCSV();

  }catch(err){ flash(err.message||String(err),"err"); }
}

function exportCSV(){
  const from=val("x_from")?new Date(val("x_from")).getTime():0;
  const to  =val("x_to")?new Date(val("x_to")).getTime()+86400000:Infinity;
  const rows=[["Name","Type","Federation","Club","Email","Phone","Address","Date of birth",
    "Boat class","Sail number","Certification","Emergency contact","Emergency phone",
    "Status","Requested arrival","Requested departure","Approved arrival","Approved departure",
    "Actual arrival","Actual departure","Waiver version","Waiver signed"]];
  allVisits().forEach(v=>{
    const t=v.approvedArrival||v.requestedArrival||0;
    if(t<from||t>to) return;
    const u=v.person;
    rows.push([u.name||"",u.accountType||"",u.federation||"",u.club||"",u.email||"",u.phone||"",
      (u.address||"").replace(/\n/g," "),u.dob||"",u.boatClass||"",u.sailNumber||"",u.certification||"",
      u.ecName||"",u.ecPhone||"",v.status||"",
      fmt(v.requestedArrival),fmt(v.requestedDeparture),fmt(v.approvedArrival),fmt(v.approvedDeparture),
      fmt(v.actualArrival),fmt(v.actualDeparture),
      u.waiver?u.waiver.version:"",u.waiver?fmt(u.waiver.signedAt):""]);
  });
  if(rows.length===1) return flash("Nothing in that date range.","err");
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="p2p-register-"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
  flash("Exported "+(rows.length-1)+" rows.");
}

render();
</script>
